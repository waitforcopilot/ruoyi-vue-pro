name: yudao-ui-admin CI

on:
  push:
    branches: [master]
    paths:
      - 'yudao-ui/yudao-ui-admin-vue3/**'
      - '.github/workflows/yudao-ui-admin.yml'
  pull_request:
    branches: [master]
    paths:
      - 'yudao-ui/yudao-ui-admin-vue3/**'
      - '.github/workflows/yudao-ui-admin.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  NODE_OPTIONS: --max-old-space-size=4096

defaults:
  run:
    shell: bash
    working-directory: yudao-ui/yudao-ui-admin-vue3

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10.30.0'
          run_install: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: yudao-ui/yudao-ui-admin-vue3/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build Vue3 application
        run: node ./node_modules/vite/bin/vite.js build --mode prod
