name: Java CI with Maven

on:
  push:
    branches: [master]
    paths:
      - 'pom.xml'
      - 'yudao-dependencies/**'
      - 'yudao-framework/**'
      - 'yudao-module-system/**'
      - 'yudao-module-infra/**'
      - 'yudao-module-bpm/**'
      - 'yudao-module-oa/**'
      - 'yudao-module-hrm/**'
      - 'yudao-server/**'
      - 'sql/**'
      - 'scripts/hrm/**'
      - '.github/workflows/maven.yml'
      - '.github/maven-settings.xml'
  pull_request:
    branches: [master]
    paths:
      - 'pom.xml'
      - 'yudao-dependencies/**'
      - 'yudao-framework/**'
      - 'yudao-module-system/**'
      - 'yudao-module-infra/**'
      - 'yudao-module-bpm/**'
      - 'yudao-module-oa/**'
      - 'yudao-module-hrm/**'
      - 'yudao-server/**'
      - 'sql/**'
      - 'scripts/hrm/**'
      - '.github/workflows/maven.yml'
      - '.github/maven-settings.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  MAVEN_OPTS: -Xmx2g -Duser.timezone=Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Run HRM regression tests
        run: >-
          mvn -B -ntp -s .github/maven-settings.xml -pl yudao-module-hrm -am test
          '-Dtest=cn.iocoder.yudao.module.hrm.**.*Test'
          -Dsurefire.failIfNoSpecifiedTests=false
          -DargLine=-Dnet.bytebuddy.experimental=true
      - name: Package enabled application modules
        run: mvn -B -ntp -s .github/maven-settings.xml -pl yudao-server -am package -DskipTests
      - name: Upload HRM test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hrm-test-reports
          path: yudao-module-hrm/target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 14
