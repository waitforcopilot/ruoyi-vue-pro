<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>薪酬管理模块 · HR系统原型与需求征集模版</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2314535C'/%3E%3Cpath d='M8 22V12l8 6 8-6v10' fill='none' stroke='%23FFB75E' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ===================== 设计规范 =====================
   产品层(真实系统): 冷色商务蓝 / 海港蓝
   需求征集层(标注): 琥珀色标签与卡片
   ==================================================== */
:root{
  --bg:#F2F5F9;
  --surface:#FFFFFF;
  --surface-2:#F8FAFC;
  --border:#E3E8F0;
  --border-strong:#CBD5E1;
  --ink:#16202E;
  --ink-2:#41536B;
  --ink-3:#7A8BA3;
  --brand:#14539C;
  --brand-deep:#0E3B74;
  --brand-soft:#E8F1FB;
  --brand-soft-line:#C7DCF2;
  --req:#C7791F;
  --req-deep:#9A5B10;
  --req-soft:#FFF3DD;
  --req-soft-line:#F3D8A6;
  --ok:#1C8A4C;
  --ok-soft:#E4F4EA;
  --warn:#D97706;
  --warn-soft:#FDF1DC;
  --danger:#D64545;
  --danger-soft:#FBE8E8;
  --info:#1673A8;
  --info-soft:#E6F3FA;
  --sidebar:#123046;
  --sidebar-hi:#1A425E;
  --shadow:0 1px 2px rgba(20,40,60,.06),0 4px 14px rgba(20,40,60,.05);
  --radius:10px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
/* ---------- 布局骨架 ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:232px;flex:0 0 232px;background:linear-gradient(180deg,#123046 0%,#0E2A3E 100%);
  color:#C6D4E2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;
}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#1F6FB2,#14539C);display:grid;place-items:center;color:#fff;flex:0 0 auto}
.brand .t{font-weight:700;color:#F2F7FC;font-size:15px;letter-spacing:.3px}
.brand .s{font-size:11px;color:#8FA9C4;margin-top:2px}
.nav-group{padding:8px 0}
.nav-group .g-label{font-size:11px;color:#7E97B2;padding:10px 18px 5px;letter-spacing:.8px;font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 18px;cursor:pointer;color:#C6D4E2;border-left:3px solid transparent;font-size:13.5px;transition:.15s}
.nav-item svg{width:17px;height:17px;flex:0 0 auto;opacity:.85}
.nav-item:hover{background:rgba(255,255,255,.05);color:#fff}
.nav-item.active{background:rgba(255,255,255,.09);color:#fff;border-left-color:#FFB75E;font-weight:600}
.sidebar-foot{margin-top:auto;padding:14px 18px;font-size:11px;color:#7E97B2;border-top:1px solid rgba(255,255,255,.07);line-height:1.5}
/* ---------- 主区 ---------- */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  height:56px;background:var(--surface);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:20;
}
.breadcrumb{font-size:13px;color:var(--ink-3)}
.breadcrumb b{color:var(--ink);font-weight:600}
.topbar .spacer{flex:1}
.top-actions{display:flex;gap:10px;align-items:center}
.period-pill{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12.5px;color:var(--ink-2)}
.period-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 auto}
/* ---------- 内容容器 ---------- */
.content{padding:22px;flex:1;max-width:1280px;width:100%;margin:0 auto}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.view-head{display:flex;align-items:flex-end;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.view-head h1{font-size:21px;font-weight:700;letter-spacing:.2px}
.view-head .sub{font-size:13px;color:var(--ink-3);margin-top:4px}
.view-head .spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:8px;font-size:13px;font-weight:600;transition:.15s;border:1px solid transparent}
.btn svg{width:15px;height:15px}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-deep)}
.btn.ghost{background:var(--surface);border-color:var(--border);color:var(--ink-2)}
.btn.ghost:hover{border-color:var(--border-strong);color:var(--ink)}
.btn.req{background:var(--req-soft);border-color:var(--req-soft-line);color:var(--req-deep)}
.btn.req:hover{background:#FFE9C6}
.btn.sm{padding:5px 11px;font-size:12.5px}
/* ---------- KPI 卡片 ---------- */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px 17px;box-shadow:var(--shadow)}
.kpi .k-label{font-size:12.5px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.kpi .k-label .tag{font-size:10.5px;color:var(--ink-3);border:1px solid var(--border);padding:1px 6px;border-radius:5px}
.kpi .k-val{font-size:24px;font-weight:700;margin-top:8px;letter-spacing:.2px}
.kpi .k-val small{font-size:13px;color:var(--ink-3);font-weight:500;margin-left:2px}
.kpi .k-sub{font-size:12px;color:var(--ink-3);margin-top:5px;display:flex;align-items:center;gap:5px}
.kpi .k-sub .up{color:var(--ok)}
.kpi .k-sub .down{color:var(--danger)}
/* ---------- 面板/卡片 ---------- */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.panel-head{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--border)}
.panel-head h3{font-size:15px;font-weight:700}
.panel-head .desc{font-size:12px;color:var(--ink-3);margin-left:2px}
.panel-head .spacer{flex:1}
.panel-body{padding:16px 18px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
/* ---------- 表格 ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th{font-size:12px;color:var(--ink-3);font-weight:600;text-align:left;padding:9px 10px;border-bottom:1px solid var(--border);background:var(--surface-2);white-space:nowrap}
td{font-size:13px;padding:10px;border-bottom:1px solid var(--border);vertical-align:middle}
tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FAFCFE}
.tbl-note{font-size:11.5px;color:var(--ink-3);padding:8px 10px 0}
/* ---------- 徽标 ---------- */
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.muted{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--border)}
.pill.req{background:var(--req-soft);color:var(--req-deep);border:1px solid var(--req-soft-line)}
.amount{font-variant-numeric:tabular-nums;font-weight:600}
.num{font-variant-numeric:tabular-nums}
/* ---------- 需求征集层 ---------- */
.req-panel{background:var(--req-soft);border:1px solid var(--req-soft-line);border-left:4px solid var(--req);border-radius:var(--radius);padding:15px 18px;margin:18px 0 6px}
.req-panel .r-head{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.req-panel .r-head .r-icon{width:22px;height:22px;border-radius:6px;background:var(--req);color:#fff;display:grid;place-items:center;flex:0 0 auto}
.req-panel .r-head .r-icon svg{width:13px;height:13px}
.req-panel .r-title{font-weight:700;color:var(--req-deep);font-size:13.5px}
.req-panel .r-tag{font-size:11px;color:var(--req-deep);border:1px solid var(--req-soft-line);background:#fff;padding:2px 8px;border-radius:5px;margin-left:auto;white-space:nowrap}
.req-cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.req-block{background:#fff;border:1px solid var(--req-soft-line);border-radius:8px;padding:11px 13px}
.req-block h4{font-size:12px;color:var(--req-deep);margin-bottom:8px;display:flex;align-items:center;gap:6px;font-weight:700}
.req-block h4 svg{width:13px;height:13px}
.req-block ul{list-style:none;display:grid;gap:6px}
.req-block li{font-size:12.5px;color:var(--ink-2);display:flex;gap:7px;align-items:flex-start}
.req-block li::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--req);margin-top:6px;flex:0 0 auto}
.req-block .ds{font-size:11px;color:var(--req-deep);background:var(--req-soft);border-radius:4px;padding:1px 5px;font-weight:600}
.req-status{margin-top:10px;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink-2);flex-wrap:wrap}
.req-status .bar{flex:1;min-width:120px;height:6px;background:var(--req-soft-line);border-radius:4px;overflow:hidden}
.req-status .bar i{display:block;height:100%;background:var(--req);border-radius:4px}
/* 征集清单(需求总览) */
.req-table td:first-child{width:20%}
.req-table .row-main{font-weight:600;color:var(--ink)}
.req-table .row-sub{font-size:11.5px;color:var(--ink-3);margin-top:2px}
/* ---------- 流程/时间轴 ---------- */
.flow{display:grid;grid-template-columns:repeat(5,1fr);gap:0;position:relative}
.flow-step{text-align:center;padding:0 8px;position:relative}
.flow-step .f-ic{width:38px;height:38px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);border:1px solid var(--brand-soft-line)}
.flow-step .f-ic svg{width:18px;height:18px}
.flow-step.done .f-ic{background:var(--ok-soft);color:var(--ok);border-color:#BFE3CE}
.flow-step.cur .f-ic{background:var(--brand);color:#fff;border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}
.flow-step .f-t{font-size:13px;font-weight:600;color:var(--ink)}
.flow-step .f-d{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.flow-connector{position:absolute;top:19px;left:50%;right:-50%;height:2px;background:var(--border-strong)}
/* ---------- 表单 ---------- */
.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.field label{font-size:12px;color:var(--ink-3);display:block;margin-bottom:6px;font-weight:500}
.field input,.field select{width:100%;padding:8px 11px;border:1px solid var(--border-strong);border-radius:8px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink)}
.field input:focus,.field select:focus{outline:2px solid var(--brand-soft);border-color:var(--brand)}
/* ---------- 图表容器 ---------- */
.chart{width:100%;height:260px}
.chart.sm{height:210px}
.chart.tall{height:320px}
/* ---------- 徽标图例 ---------- */
.legend-line{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-top:8px}
.legend-line .li{display:flex;align-items:center;gap:6px}
.legend-line .sw{width:10px;height:10px;border-radius:3px;flex:0 0 auto}
/* ---------- 工具 ---------- */
.empty-hint{font-size:12px;color:var(--ink-3);font-style:normal}
.muted{color:var(--ink-3)}
.tbl-cap{font-size:11px;color:var(--ink-3);padding:6px 10px 12px;display:flex;gap:8px;align-items:center}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(20px);background:#16202E;color:#fff;padding:10px 18px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .tag{color:#FFB75E;font-weight:700;margin-right:6px}
/* ---------- 响应式 ---------- */
@media (max-width:980px){
  .sidebar{position:fixed;left:-240px;transition:.25s;z-index:50;height:100vh}
  .sidebar.open{left:0}
  .menu-btn{display:grid!important;place-items:center;width:44px;height:44px;border-radius:8px;border:1px solid var(--border);background:var(--surface-2)}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .grid-2,.grid-3,.req-cols,.form-grid{grid-template-columns:1fr}
  .flow{grid-template-columns:1fr;gap:14px}
  .flow-connector{display:none}
  .content{padding:16px}
}
@media (max-width:640px){
  .btn{padding:10px 14px}
}
@media (max-width:560px){
  .kpi-grid{grid-template-columns:1fr}
  .breadcrumb{display:none}
  .period-pill{display:none}
  .top-actions .btn.ghost{display:none}
  .topbar{padding:0 12px}
}
</style>
</head>
<body>
<div class="app">
  <!-- ===== 侧边导航 ===== -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17V8l8 5 8-5v9"/></svg>
      </div>
      <div>
        <div class="t">HR 人力资源系统</div>
        <div class="s">薪酬管理模块 · 原型与需求模版</div>
      </div>
    </div>
    <div class="nav-group">
      <div class="g-label">总览</div>
      <div class="nav-item" data-view="overview">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        薪酬总览
      </div>
      <div class="g-label">薪酬基础</div>
      <div class="nav-item" data-view="plan">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 3 8l9 5 9-5-9-5Z"/><path d="M6 12v4c0 1.7 2.7 3 6 3s6-1.3 6-3v-4"/><path d="M20 8v8"/></svg>
        薪酬方案
      </div>
      <div class="g-label">核算流程</div>
      <div class="nav-item" data-view="calc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 7h.01M12 7h.01M16 7h.01M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01"/></svg>
        工资核算
      </div>
      <div class="nav-item" data-view="tax">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-9Z"/><path d="M6 10V7a6 6 0 0 1 12 0v3"/><path d="M12 15v3"/></svg>
        个税与工资条
      </div>
      <div class="g-label">数据要素</div>
      <div class="nav-item" data-view="attendance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        考勤数据
      </div>
      <div class="nav-item" data-view="overtime">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8h1a4 4 0 0 1 0 8h-1"/><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8Z"/><path d="M6 4h12"/><path d="M10 12v4M14 12v4"/></svg>
        加班管理
      </div>
      <div class="nav-item" data-view="hours">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5h-3"/><path d="M5 19 3 21"/><path d="M19 19l2 2"/></svg>
        工时管理
      </div>
      <div class="g-label">法定成本</div>
      <div class="nav-item" data-view="insurance">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></svg>
        社保公积金
      </div>
      <div class="g-label">分析与征集</div>
      <div class="nav-item" data-view="report">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15v-5M12 15V7M17 15v-3"/></svg>
        报表分析
      </div>
      <div class="nav-item req-item" data-view="req">
        <svg viewBox="0 0 24 24" fill="none" stroke="#FFB75E" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h10"/><path d="m17 15 2 2 4-4"/></svg>
        需求征集总览
      </div>
    </div>
    <div class="sidebar-foot">原型 v0.1 · 2026-09 · 用于征集薪酬模块功能需求与数据源需求</div>
  </aside>

  <!-- ===== 主区 ===== -->
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" style="display:none" id="menuBtn" onclick="document.getElementById('sidebar').classList.toggle('open')">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="breadcrumb">薪酬管理模块 / <b id="crumbTitle">薪酬总览</b></div>
      <div class="spacer"></div>
      <div class="period-pill"><span class="dot"></span><span>核算期间：2026年09月</span></div>
      <div class="top-actions">
        <button class="btn ghost sm" onclick="goto('req')">征集需求清单</button>
        <button class="btn req sm" onclick="toast('本原型用于征集功能与数据源需求，示例数据仅为演示。')">原型说明</button>
      </div>
    </header>

    <main class="content">
      <!-- ===== 视图由 JS 注入 ===== -->
      <div id="views"></div>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
/* ===================== 路由与公共 ===================== */
const VIEWS = [
  {id:'overview', title:'薪酬总览'},
  {id:'plan', title:'薪酬方案'},
  {id:'calc', title:'工资核算'},
  {id:'tax', title:'个税与工资条'},
  {id:'attendance', title:'考勤数据'},
  {id:'overtime', title:'加班管理'},
  {id:'hours', title:'工时管理'},
  {id:'insurance', title:'社保公积金'},
  {id:'report', title:'报表分析'},
  {id:'req', title:'需求征集总览'}
];
const charts = {};
let toastTimer=null;
function toast(msg){const t=document.getElementById('toast');t.innerHTML='<span class="tag">演示</span>'+msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2800);}
function goto(id){
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.toggle('active', n.dataset.view===id));
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  const el=document.getElementById('view-'+id);
  if(el){el.classList.add('active');document.getElementById('sidebar').classList.remove('open');}
  const c=VIEWS.find(v=>v.id===id);if(c)document.getElementById('crumbTitle').textContent=c.title;
  if(id!=='req' && id!=='overview'){ /* 需求按钮已内嵌在各模块 */ }
  window.scrollTo({top:0,behavior:'auto'});

function mountChart(id,view,opt){

  const c=echarts.init(el);c.setOption(opt);charts[id]={inst:c,view};
  window.addEventListener('resize',()=>c.resize());
}

      <thead><tr><th>模块</th><th>功能需求点</th><th>依赖数据源</th><th>优先级</th><th>征集状态</th></tr></thead>

        <tr><td class="row-main">薪酬总览</td><td>汇总指标、核算期间切换、数据归集完成度看板、异常提醒</td><td>薪酬明细、考勤/加班/工时/社保汇总</td><td><span class="pill info">高</span></td><td><span class="pill ok">已确认</span></td></tr>
        <tr><td class="row-main">薪酬方案</td><td>薪酬结构可配置、薪级表维护、定调薪流程、版本管理</td><td>人事档案、薪级表、岗位职级表、补贴标准、调薪审批流</td><td><span class="pill info">高</span></td><td><span class="pill warn">待确认</span></td></tr>
        <tr><td class="row-main">工资核算</td><td>批次生命周期、算薪公式引擎、异常拦截、银行代发、工资条</td><td>员工主数据、考勤汇总、加班工时、社保公积金、个税、代发明细</td><td><span class="pill info">高</span></td><td><span class="pill warn">待确认</span></td></tr>
        <tr><td class="row-main">个税与工资条</td><td>累计预扣法、专项附加扣除、工资条多渠道推送、年终奖</td><td>累计收入、社保个人、专项附加扣除、税率表、银行明细</td><td><span class="pill info">高</span></td><td><span class="pill warn">待确认</span></td></tr>
        <tr><td class="row-main">考勤数据</td><td>考勤归集、单据关联、异常判定与处理、与薪酬联动</td><td>考勤打卡、请假/出差/补卡单、考勤规则</td><td><span class="pill info">高</span></td><td><span class="pill warn">待确认</span></td></tr>
        <tr><td class="row-main">加班管理</td><td>加班审批、倍率计算、调休、合规提醒</td><td>加班申请、审批流、打卡时长、薪酬规则、调休记录</td><td><span class="pill warn">中</span></td><td><span class="pill warn">待确认</span></td></tr>
        <tr><td class="row-main">工时管理</td><td>工时制度维护、周期结算、报表、异常提醒</td><td>工时制度档案、排班表、考勤明细、结算规则</td><td><span class="pill warn">中</span></td><td><span class="pill danger">有异议</span></td></tr>
        <tr><td class="row-main">社保公积金</td><td>基数申报、比例配置、个人扣款联动、缴纳台账</td><td>参保名单、缴费基数、政策比例、缴费明细、入离职变动</td><td><span class="pill info">高</span></td><td><span class="pill warn">待确认</span></td></tr>
        <tr><td class="row-main">报表分析</td><td>成本分摊、人效指标、结构分析、预算对比、口径导出</td><td>薪酬明细、社保汇总、组织档案、营收预算、编制</td><td><span class="pill warn">中</span></td><td><span class="pill warn">待确认</span></td></tr>
      </tbody>
    </table>
    <div class="tbl-note">征集状态由相关方在评审会上确认后更新；「有异议」项需单独复盘，如工时结算规则口径。</div>
  </div></div>

      <div class="req-block"><h4>产出物</h4><ul><li>经确认后的《薪酬模块功能需求说明书》</li><li>《数据源清单与接口需求》</li><li>原型迭代至可进入开发的版本</li></ul></div>

  </div>
</section>`;
